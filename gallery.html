<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="shoppage">

  <a href="index.html" class="back-btn">Home</a>

  <div class="shop-container" id="shop-container"></div>

  <script>
  const images = [
    "You Don't Deserve to Win.png",
    "tree.JPG",
    "somethingtodrink.JPG",
    "footindoor.png",
    "ogliceinmanderland.JPG",
    "love.JPG",
    "ankle.JPG",
    "futureofdentistry.JPG",
    "gumshoe.JPG",
    "doppelganger.png",
    "saved.PNG",
    "hand.JPG",
    "excite.jpeg",
    "beak.jpeg",
    "sunshine.jpeg",
    "eyepull.jpeg",
    "gardening.jpeg",
    "pastanight.JPG",
    "incup.JPG",
    "stillpasttense.png",
    "torchys.JPG",
    "wathcingtele.JPG",
    "almost friday.JPG",
    "song list.JPG",
    "remember.JPG",
    "sleepinglate.JPG",
    "stanley moves in.png",
    "henry.png",
    "Varmorigin.png",
    "14(based).png",
    "touch art.JPG",
    "wunder.png",
    "me.JPG",
    "manincup.JPG",
  ];

  const container = document.getElementById("shop-container");

  const masonry = document.createElement("div");
  masonry.className = "masonry";

  images.forEach(imgName => {
    const item = document.createElement("div");
    item.className = "shop-item";

    const image = document.createElement("img");
    image.src = `images/${imgName}`;
    image.alt = imgName;
    image.loading = "lazy";

    item.appendChild(image);
    masonry.appendChild(item);
  });

  container.appendChild(masonry);
</script>


</body>
</html>
